[project]
name = "tri-planner"
version = "0.1.0"
description = "Facility-aware triathlon weekly planner (v0, n=1)"
requires-python = ">=3.11"
dependencies = ["ortools>=9.10", "pydantic>=2", "pyyaml", "pandas", "scipy", "icalendar>=6"]

[project.optional-dependencies]
fit = ["fit-tool"]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "pandas-stubs"]

[project.scripts]
tri-plan = "planner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The planner works in local wall-clock time on purpose; tests use naive datetimes.
"tests/*" = ["DTZ001"]
